<!doctype html>
<html lang="en" class="dark" data-theme="dark" data-accent="emerald">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mantis — Personal Coding AI Studio</title>
    <meta
      name="description"
      content="Personal AI engineering and knowledge-training workbench with built-in concept memory, live ingestion, and multi-device Supabase sync."
    />
    <meta property="og:title" content="Mantis — Personal Coding AI Studio" />
    <meta
      property="og:description"
      content="Personal AI engineering and knowledge-training workbench with built-in concept memory, live ingestion, and multi-device Supabase sync."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mantis_theme_v1') || 'dark';
          if (t !== 'dark' && t !== 'dim' && t !== 'light') t = 'dark';
          var a = localStorage.getItem('mantis_accent_v1') || 'emerald';
          if (
            a !== 'emerald' &&
            a !== 'blue' &&
            a !== 'violet' &&
            a !== 'amber' &&
            a !== 'rose'
          ) {
            a = 'emerald';
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', t);
          root.setAttribute('data-accent', a);
          if (t === 'light') {
            root.classList.remove('dark');
          } else {
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
